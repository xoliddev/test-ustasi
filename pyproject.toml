[project]
name = "test-ustasi"
version = "1.0.0"
description = "A Telegram bot and Mini App for teachers: a PDF or a text becomes a multiple-choice test (every question backed by a verified quote from the source), students solve it in the Mini App, and the teacher gets the results table, an analysis of the wrong answers and a one-tap retest"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 170
target-version = "py312"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "S603"]
"scripts/*" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
